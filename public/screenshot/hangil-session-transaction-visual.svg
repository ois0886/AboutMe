<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e2b4c"/></marker>
    <style>
      text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #0e2b4c; text-anchor: middle; }
      .title { font-size: 16px; font-weight: 800; }
      .label { font-size: 14px; font-weight: 750; }
      .small { font-size: 12px; font-weight: 550; }
      .node { fill: #f7f0e2; stroke: #0e2b4c; stroke-width: 1.6; }
      .line { fill: none; stroke: #0e2b4c; stroke-width: 1.7; marker-end: url(#arrow); }
      .permit { fill: #e2f1ec; stroke: #176755; stroke-width: 1.6; }
      .blocked { fill: #fff0e9; stroke: #98503c; stroke-width: 1.6; }
      .dark { fill: #0e2b4c; }
      .white { fill: #ffffff; }
    </style>
  </defs>
  <title id="title">허용 조건을 쓰기 전후에 검사하는 Room 트랜잭션</title>
  <desc id="desc">시작 스냅샷 저장과 종료 시각 쓰기는 Room 트랜잭션 안에서 처리한다. 쓰기 전후 canCommit이 참인 경우 쓰기를 확정하고, 잠금으로 바뀌면 WriteBlocked를 던져 전체 트랜잭션을 롤백한 뒤 Blocked 결과를 반환한다.</desc>
  <text class="title" x="200" y="21">잠금 전환 시 트랜잭션 전체 롤백</text>
  <rect x="10" y="43" width="380" height="213" rx="8" fill="none" stroke="#0e2b4c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="small" x="106" y="60">Room withTransaction</text>
  <rect class="node" x="85" y="71" width="230" height="41" rx="4"/>
  <text class="label" x="200" y="97">쓰기 전 허용 검사</text>
  <path class="line" d="M200 112 V122"/>
  <rect class="node" x="85" y="126" width="230" height="46" rx="4"/>
  <text class="label" x="200" y="145">시작: 목표와 코스 스냅샷</text><text class="small" x="200" y="163">종료: 종료 시각 갱신</text>
  <path class="line" d="M200 172 V182"/>
  <rect class="node" x="85" y="186" width="230" height="42" rx="4"/>
  <text class="label" x="200" y="212">쓰기 후에도 허용되는가?</text>
  <path class="line" d="M200 228 V247 H100 V285"/>
  <text class="label" x="124" y="271">허용</text>
  <path class="line" d="M315 207 H348 V276 H300 V285"/>
  <text class="small" x="350" y="242">불허</text>
  <path class="line" d="M315 91 H372 V280 H310 V285"/>
  <text class="small" x="350" y="115">불허</text>
  <rect class="permit" x="10" y="291" width="180" height="47" rx="5"/>
  <text class="label" x="100" y="311">COMMIT</text><text class="small" x="100" y="329">쓰기 확정</text>
  <rect class="blocked" x="210" y="291" width="180" height="47" rx="5"/>
  <text class="label" x="300" y="311">ROLLBACK</text><text class="small" x="300" y="329">WriteBlocked → Blocked</text>
</svg>
