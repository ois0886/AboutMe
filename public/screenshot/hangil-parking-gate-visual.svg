<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e2b4c"/></marker>
    <style>
      text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #0e2b4c; text-anchor: middle; }
      .title { font-size: 16px; font-weight: 800; }
      .label { font-size: 14px; font-weight: 750; }
      .small { font-size: 12px; font-weight: 550; }
      .node { fill: #f7f0e2; stroke: #0e2b4c; stroke-width: 1.6; }
      .line { fill: none; stroke: #0e2b4c; stroke-width: 1.7; marker-end: url(#arrow); }
      .permit { fill: #e2f1ec; stroke: #176755; stroke-width: 1.6; }
      .blocked { fill: #fff0e9; stroke: #98503c; stroke-width: 1.6; }
      .dark { fill: #0e2b4c; }
      .white { fill: #ffffff; }
    </style>
  </defs>
  <title id="title">최신 차량과 UX 상태를 모두 확인하는 조작 잠금</title>
  <desc id="desc">현재 차량이 연결되어 P이고 제한 제공자가 주차와 UX 제한 해제를 모두 확인한 경우에만 상세 조작을 허용한다. 하나라도 미확인, 연결 끊김 또는 권한 거부이면 잠금을 유지하며 실제 처리 직전에도 다시 검사한다.</desc>
  <text class="title" x="200" y="21">표시와 실제 조작에 같은 잠금 조건</text>
  <rect class="node" x="10" y="42" width="180" height="51" rx="5"/>
  <text class="label" x="100" y="63">최신 차량</text><text class="small" x="100" y="82">연결됨 + 기어 P</text>
  <rect class="node" x="210" y="42" width="180" height="51" rx="5"/>
  <text class="label" x="300" y="63">제한 제공자</text><text class="small" x="300" y="82">주차 확인 + UX 해제</text>
  <path class="line" d="M100 93 V105 H200 V114"/><path class="line" d="M300 93 V105 H200 V114"/>
  <path class="node" d="M200 117 L318 165 L200 213 L82 165 Z"/>
  <text class="label" x="200" y="160">두 상태 모두</text><text class="label" x="200" y="179">조작 허용?</text>
  <path class="line" d="M82 165 H52 V244"/><path class="line" d="M318 165 H348 V244"/>
  <text class="label" x="69" y="226">예</text><text class="label" x="322" y="226">아니오</text>
  <rect class="permit" x="10" y="250" width="180" height="55" rx="5"/>
  <text class="label" x="100" y="273">상세 조작 허용</text><text class="small" x="100" y="293">처리 직전 재확인</text>
  <rect class="blocked" x="210" y="250" width="180" height="55" rx="5"/>
  <text class="label" x="300" y="273">잠금 유지</text><text class="small" x="300" y="293">미확인 / 끊김 / 권한 거부</text>
  <text class="small" x="200" y="337">이전 P 표시가 남아도 새 D 상태는 차단</text>
</svg>
