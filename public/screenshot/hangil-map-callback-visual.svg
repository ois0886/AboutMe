<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e2b4c"/></marker>
    <style>
      text { font-family: Pretendard, 'Noto Sans KR', sans-serif; fill: #0e2b4c; text-anchor: middle; }
      .title { font-size: 16px; font-weight: 800; }
      .label { font-size: 14px; font-weight: 750; }
      .small { font-size: 12px; font-weight: 550; }
      .node { fill: #f7f0e2; stroke: #0e2b4c; stroke-width: 1.6; }
      .line { fill: none; stroke: #0e2b4c; stroke-width: 1.7; marker-end: url(#arrow); }
      .permit { fill: #e2f1ec; stroke: #176755; stroke-width: 1.6; }
      .blocked { fill: #fff0e9; stroke: #98503c; stroke-width: 1.6; }
      .dark { fill: #0e2b4c; }
      .white { fill: #ffffff; }
    </style>
  </defs>
  <title id="title">재시도 번호와 MapView 토큰으로 이전 콜백 폐기</title>
  <desc id="desc">렌더 완료 콜백의 재시도 번호와 MapView 생성 토큰이 현재 값과 일치하고 LOADING 상태이며 최신 조작 조건을 허용할 때만 READY로 전환한다. 이전 콜백이나 불허 상태는 무시한다. 현재 렌더 오류는 FAILED로 처리하고 재시도는 새로운 번호를 만든다.</desc>
  <text class="title" x="200" y="21">이전 콜백 폐기, 현재 렌더만 완료</text>
  <rect class="node" x="10" y="43" width="180" height="50" rx="5"/>
  <text class="label" x="100" y="64">이전 MapView</text><text class="small" x="100" y="83">이전 번호 / 토큰</text>
  <rect class="node" x="210" y="43" width="180" height="50" rx="5"/>
  <text class="label" x="300" y="64">현재 MapView</text><text class="small" x="300" y="83">현재 번호 / 토큰</text>
  <path class="line" d="M100 93 V103 H200 V111"/><path class="line" d="M300 93 V103 H200 V111"/>
  <path class="node" d="M200 114 L328 174 L200 234 L72 174 Z"/>
  <text class="label" x="200" y="158">attempt + token 일치</text><text class="small" x="200" y="179">LOADING + 조작 허용</text><text class="label" x="200" y="200">모두 충족?</text>
  <path class="line" d="M72 174 H44 V263"/><path class="line" d="M328 174 H356 V263"/>
  <text class="small" x="90" y="250">불일치 / 불허</text><text class="small" x="305" y="250">모두 충족</text>
  <rect class="blocked" x="10" y="269" width="180" height="47" rx="5"/>
  <text class="label" x="100" y="289">콜백 무시</text><text class="small" x="100" y="307">현재 상태 유지</text>
  <rect class="permit" x="210" y="269" width="180" height="47" rx="5"/>
  <text class="label" x="300" y="289">READY</text><text class="small" x="300" y="307">현재 지도만 완료</text>
  <text class="small" x="200" y="340">현재 렌더 오류: FAILED / 재시도: 새 번호</text>
</svg>
